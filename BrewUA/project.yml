name: BrewUA
options:
  bundleIdPrefix: com.brewua
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  BrewUA:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brewua.app
        INFOPLIST_KEY_CFBundleDisplayName: "BrewUA"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ENABLE_APP_SANDBOX: "NO"
        LSMinimumSystemVersion: "14.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_EMIT_LOC_STRINGS: NO
    scheme:
      testTargets:
        - BrewUATests
  BrewUATests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/Services/StreamedProcess.swift
      - path: Sources/Services/BrewService.swift
      - path: Sources/Services/ConfigService.swift
      - path: Sources/Services/EnvDetector.swift
      - path: Sources/Models
      - path: Sources/Engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brewua.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"