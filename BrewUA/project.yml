name: BrewUA
options:
  bundleIdPrefix: com.brewua
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  BrewUA:
    type: application
    platform: macOS
    sources:
      - Sources
      # brew-ua CLI 脚本打进资源(直接引用仓库根脚本,单一来源免同步)
      - path: ../brew-ua
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brewua.app
        INFOPLIST_KEY_CFBundleDisplayName: "BrewUA"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ENABLE_APP_SANDBOX: "NO"
        LSMinimumSystemVersion: "14.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_EMIT_LOC_STRINGS: NO
    scheme:
      testTargets:
        - BrewUATests
  BrewUATests:
    # 测试 target 直接编入被测源文件(非 TEST_HOST 模式):
    # 实测 TEST_HOST 依赖 app 时 runner 挂起无法建立连接;复制源文件模式下
    # internal 符号直接可见,无需 @testable import。新增被测文件须同步登记。
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/Services/StreamedProcess.swift
      - path: Sources/Services/BrewGate.swift
      - path: Sources/Services/BrewService.swift
      - path: Sources/Services/HistoryService.swift
      - path: Sources/Services/ConfigService.swift
      - path: Sources/Services/EnvDetector.swift
      - path: Sources/Services/CLIInstallerService.swift
      - path: Sources/Models
      - path: Sources/Engine
      # 测试 bundle 同样注册脚本资源,供 CLIInstallerService 资源解析用例使用
      - path: ../brew-ua
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brewua.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
