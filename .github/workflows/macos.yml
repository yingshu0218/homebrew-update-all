name: macOS App

on:
  push:
    branches: [main]
    paths:
      - 'BrewUA/**'
      - 'brew-ua'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'BrewUA/**'
      - 'brew-ua'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit to validate after CNB sync
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec BrewUA/project.yml
      - name: Build app and run unit tests
        run: >-
          xcodebuild test
          -project BrewUA/BrewUA.xcodeproj
          -scheme BrewUA
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/BrewUA-DerivedData"
          CODE_SIGNING_ALLOWED=NO
      - name: Check download sampling with Thread Sanitizer
        run: bash BrewUA/scripts/verify-gui.sh tsan
      - name: Typecheck offline render tool
        run: bash BrewUA/scripts/verify-gui.sh render
