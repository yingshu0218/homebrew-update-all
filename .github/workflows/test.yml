name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit to validate after CNB sync
        required: true
        type: string

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: zsh 语法检查
        run: zsh -n brew-ua

      - name: 冒烟测试（stub brew，无网络）
        run: zsh scripts/test.sh

      - name: CLI 边界回归（假 brew、临时 HOME/TMPDIR）
        run: python3 scripts/test-cli-edge.py

      - name: CLI 并发启动与崩溃释放锁
        run: python3 scripts/test-cli-lock.py

      - name: Formula 校验（语法 + 结构，不依赖 tap 信任）
        run: |
          ruby -c Formula/brew-update-all.rb
          grep -q 'def install' Formula/brew-update-all.rb
          grep -q 'test do' Formula/brew-update-all.rb
          grep -qE '^  url "' Formula/brew-update-all.rb
          grep -qE '^  sha256 "' Formula/brew-update-all.rb

      - name: brew audit（Homebrew 官方审计）
        run: |
          # Homebrew 已移除按文件路径审计，先放入本地 tap，再按完整名称审计。
          brew tap-new --no-git local/ci
          cp Formula/brew-update-all.rb "$(brew --repository local/ci)/Formula/"
          brew trust local/ci
          brew audit --formula --strict local/ci/brew-update-all || \
          brew audit --formula local/ci/brew-update-all
