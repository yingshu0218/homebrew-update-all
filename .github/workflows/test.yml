name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: zsh 语法检查
        run: zsh -n brew-ua

      - name: 冒烟测试（stub brew，无网络）
        run: zsh scripts/test.sh

      - name: Formula 校验（语法 + 结构，不依赖 tap 信任）
        run: |
          ruby -c Formula/brew-update-all.rb
          grep -q 'def install' Formula/brew-update-all.rb
          grep -q 'test do' Formula/brew-update-all.rb
          grep -qE '^  url "' Formula/brew-update-all.rb
          grep -qE '^  sha256 "' Formula/brew-update-all.rb
