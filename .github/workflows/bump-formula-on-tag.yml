name: Auto-bump Formula on tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag to apply to Formula
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bump-formula
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump formula url and sha256
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
          RELEASE_TAG_SELECTOR: ${{ github.workspace }}/scripts/release-tags.py
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${TAG_INPUT}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          python3 "$RELEASE_TAG_SELECTOR" compare "$TAG" "$TAG" >/dev/null
          REPO="${GITHUB_REPOSITORY}"
          FORMULA="Formula/brew-update-all.rb"

          git fetch --no-tags origin main
          git checkout -B formula-bump origin/main
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          echo "formula base: $(git rev-parse HEAD), tag ${TAG}: ${TAG_SHA}"

          CURRENT_TAG=$(ruby -e '
            formula = File.read(ARGV.fetch(0))
            match = formula.match(/^  url "[^\"]*\/tags\/(v[^\"]+)\.tar\.gz"$/)
            puts(match ? match[1] : "")
          ' "$FORMULA")
          if [[ -n "$CURRENT_TAG" ]]; then
            python3 "$RELEASE_TAG_SELECTOR" require-not-older "$TAG" "$CURRENT_TAG"
          fi

          # 从 GitHub 下载 tag tarball 并计算 sha256（动态生成，勿用本地 archive）
          # 加重试：GitHub codeload 偶发 502/连接抖动
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "${URL}" | shasum -a 256 | awk '{print $1}')
          echo "tag=${TAG} sha256=${SHA}"

          # 幂等：Formula 已指向该版本则跳过
          if grep -Fq "${TAG}.tar.gz" "$FORMULA" && grep -Fq "${SHA}" "$FORMULA"; then
            echo "Formula 已是最新，无需更新"
            exit 0
          fi

          # 更新 url 与 sha256（ruby 精确匹配顶层 url/sha256 行，避免 sed 误伤）
          ruby -e '
            f, url, sha = ARGV
            s = File.read(f)
            s.sub!(/^  url "[^"]*"/, %Q{  url "#{url}"})
            s.sub!(/^  sha256 "[0-9a-f]*"/, %Q{  sha256 "#{sha}"})
            File.write(f, s)
          ' "$FORMULA" "$URL" "$SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          if git diff --cached --quiet; then
            echo "Formula 已是最新，无需更新"
            exit 0
          fi
          git commit -m "Bump version to ${TAG}"
          # Rebase on the latest main in case another independent main update
          # landed while the tarball checksum was being computed. The push stays
          # fast-forward only; a Formula conflict fails visibly for review.
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
